name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sonarcloud:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # No docker/Docker Hub job: the image is built in-cluster from this repo's
  # GitHub URL by k8s/build-job.yaml (Kaniko), pushed straight to the
  # in-cluster registry Deployed by the Backend repo. VITE_MSAL_CLIENT_ID/
  # VITE_MSAL_AUTHORITY now come from a k8s Secret consumed by that Job
  # instead of these GitHub Actions secrets — see k8s/README.md.
