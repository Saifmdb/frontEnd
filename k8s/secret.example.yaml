# Template only — copy to secret.yaml with the real Azure AD app values
# (git-ignored) before applying. Consumed by build-job.yaml as Kaniko
# --build-arg values: these get baked into the JS bundle at image-build time,
# same as when they used to be passed via GitHub Actions secrets — the only
# thing that changed is which system does the building.
apiVersion: v1
kind: Secret
metadata:
  name: honoris-frontend-build-secrets
  namespace: honoris
type: Opaque
stringData:
  VITE_MSAL_CLIENT_ID: "REPLACE_ME"
  VITE_MSAL_AUTHORITY: "https://login.microsoftonline.com/common"
  VITE_MSAL_REDIRECT_URI: "https://honoris.example.com/signin"
  VITE_BACKEND_URL: "https://honoris.example.com"
