version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15
    container_name: projchat_db_hub
    environment:
      POSTGRES_DB: honoris_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - projchat_network

  # Backend Django depuis Docker Hub
  backend:
    image: saifmed/projchat-backend:latest
    container_name: projchat_backend_hub
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:password123@db:5432/honoris_chatbot
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - OLLAMA_API_URL=http://host.docker.internal:11434
    volumes:
      - media_files:/app/media
      - static_files:/app/static
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - projchat_network
    command: python manage.py runserver 0.0.0.0:8000

  # Frontend React depuis Docker Hub
  frontend:
    image: saifmed/projchat-frontend:latest
    container_name: projchat_frontend_hub
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_CHATBOT_URL=http://localhost:8000/api/chatbot
    networks:
      - projchat_network
    command: npm start

  # Nginx depuis Docker Hub
  nginx:
    image: saifmed/projchat-nginx:latest
    container_name: projchat_nginx_hub
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - static_files:/app/static
      - media_files:/app/media
    depends_on:
      - backend
      - frontend
    networks:
      - projchat_network

  # Ollama pour le LLM
  ollama:
    image: ollama/ollama:latest
    container_name: projchat_ollama_hub
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - projchat_network
    command: ollama serve

  # Redis pour le cache
  redis:
    image: redis:7-alpine
    container_name: projchat_redis_hub
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - projchat_network

volumes:
  postgres_data:
  media_files:
  static_files:
  ollama_data:
  redis_data:

networks:
  projchat_network:
    driver: bridge
