version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15
    container_name: projchat_db
    environment:
      POSTGRES_DB: honoris_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - projchat_network

  # Backend Django
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: projchat_backend
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:password123@db:5432/honoris_chatbot
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - OLLAMA_API_URL=http://host.docker.internal:11434
    volumes:
      - ../backend:/app
      - media_files:/app/media
      - static_files:/app/static
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - projchat_network
    command: python manage.py runserver 0.0.0.0:8000

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: projchat_frontend
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_API_URL=http://localhost:8000/api
      - VITE_API_FILE_URL=http://localhost:8000
      - VITE_BACKEND_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_CHATBOT_URL=http://localhost:8000/api/chatbot
    networks:
      - projchat_network
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # Serveur de production Nginx
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: projchat_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - projchat_network

  # Ollama pour le LLM (optionnel)
  ollama:
    image: ollama/ollama:latest
    container_name: projchat_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - projchat_network
    command: ollama serve

  # Redis pour le cache (optionnel)
  redis:
    image: redis:7-alpine
    container_name: projchat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - projchat_network

volumes:
  postgres_data:
  media_files:
  static_files:
  ollama_data:
  redis_data:

networks:
  projchat_network:
    driver: bridge
